<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Admin Login — Satta Takht</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: radial-gradient(ellipse at top, #1a0800 0%, #0d0d0d 70%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px;
    }
    .login-box {
      background: #1a1a2e;
      border: 2px solid #FF8C00;
      border-radius: 20px;
      padding: 36px 28px 32px;
      width: 100%; max-width: 360px;
      text-align: center;
      box-shadow: 0 0 40px rgba(255,140,0,0.15);
    }
    .crown { font-size: 2.5rem; margin-bottom: 8px; }
    .brand-main { color: #FFD700; font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; }
    .brand-by { color: #FF8C00; font-size: 0.75rem; font-weight: 600; letter-spacing: 3px; margin-top: 2px; }
    .subtitle { color: #666; font-size: 0.82rem; margin: 16px 0 24px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { color: #888; font-size: 0.78rem; display: block; margin-bottom: 6px; letter-spacing: 1px; }
    input {
      width: 100%; padding: 13px 16px;
      background: #0d0d0d; border: 1.5px solid #2a2a2a;
      border-radius: 10px; color: #fff; font-size: 1rem; outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #FF8C00; }
    .btn-login {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #FF8C00, #cc6600);
      color: #000; font-weight: 800; font-size: 1rem;
      border: none; border-radius: 10px; cursor: pointer; margin-top: 8px;
      letter-spacing: 1px; transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.85; }
    .error {
      background: rgba(255,23,68,0.12); border: 1px solid #ff1744;
      color: #ff6b6b; border-radius: 10px;
      padding: 10px; margin-bottom: 16px; font-size: 0.84rem;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="crown">👑</div>
    <div class="brand-main">SATTA TAKHT</div>
    <div class="brand-by">BY SAURAV</div>
    <p class="subtitle">Admin Control Panel</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="form-group">
        <label>USERNAME</label>
        <input type="text" name="username" placeholder="Enter username" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn-login">🔐 LOGIN</button>
    </form>
  </div>
</body>
</html>
